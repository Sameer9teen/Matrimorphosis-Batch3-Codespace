<section class="container py-5">
  <h2 class="text-center mb-5">
    Ride History
  </h2>

  <div class="row g-4">
    @for (ride of rides; track ride.id) {
      <div class="col-md-4">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h4>
              Ride #{{ ride.id }}
            </h4>

            <p>
              {{ ride.pickup }} → {{ ride.destination }}
            </p>

            <p>
              Fare: ₹{{ ride.fare }}
            </p>

            <button
              class="btn btn-dark"
              [routerLink]="['/ride-history', ride.id]"
            >
              View Details
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</section>
